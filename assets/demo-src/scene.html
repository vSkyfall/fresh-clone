<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --stage: #161b22;
    --win: #0d1117;
    --bar: #1c2129;
    --line: #2a313c;
    --fg: #d6dbe4;
    --dim: #7d8590;
    --faint: #4a525e;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --blue: #58a6ff;
    --purple: #bc8cff;
    --code: #e6edf3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--stage); }
  #stage {
    width: 1000px; height: 640px; padding: 20px;
    background: var(--stage);
    font-family: "SF Mono", SFMono-Regular, Menlo, Monaco, monospace;
    font-size: 14px; line-height: 21px; color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }
  .win {
    width: 100%; height: 100%; border-radius: 12px; overflow: hidden;
    background: var(--win); border: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  .bar {
    height: 34px; flex: none; background: var(--bar); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; padding: 0 14px; gap: 8px; position: relative;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .bar .title {
    position: absolute; left: 0; right: 0; text-align: center; color: var(--dim);
    font-size: 12.5px; pointer-events: none;
  }
  .body { flex: 1; padding: 16px 22px; position: relative; overflow: hidden; }
  .l { white-space: pre; height: 21px; }
  .dim { color: var(--dim); }
  .faint { color: var(--faint); }
  .g { color: var(--green); } .r { color: var(--red); } .y { color: var(--yellow); }
  .b { color: var(--blue); } .p { color: var(--purple); }
  .bold { font-weight: 700; }
  code { font-family: inherit; color: var(--code); }
  .caret { display: inline-block; width: 8px; height: 16px; background: var(--fg); vertical-align: -3px; }
  .spin {
    display: inline-block; width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid var(--faint); border-top-color: var(--blue); vertical-align: -1px;
  }
  .row { display: grid; grid-template-columns: 26px 22px 330px 56px 1fr; white-space: pre; height: 21px; }
  .row .t { color: var(--faint); text-align: right; padding-right: 14px; }
  .sug { display: grid; grid-template-columns: 26px 86px 250px 1fr; white-space: pre; height: 21px; }
  .pill {
    display: inline-block; padding: 0 9px; border-radius: 999px; line-height: 19px; height: 19px;
    font-weight: 700; font-size: 13px;
  }
  .pill.r { background: #3a1d1f; color: var(--red); }
  .card {
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px 10px; margin: 6px 0 0;
    background: #11161d;
  }
  .card .k { color: var(--dim); font-size: 12.5px; height: 21px; }
  .card .q { font-weight: 700; height: 21px; white-space: pre; }
  .card .why { color: var(--dim); height: 21px; white-space: pre; margin-bottom: 6px; }
  .opt { height: 25px; line-height: 25px; padding: 0 10px; border-radius: 6px; white-space: pre; color: var(--dim); }
  .opt.on { background: #16273b; color: var(--fg); }
  .opt.on .ptr { color: var(--blue); }
  .opt.hit { background: #1f4a7a; color: #fff; }
  .opt .ptr { display: inline-block; width: 18px; color: transparent; }
  .opt .input { color: var(--fg); }
  .k .prog { float: right; letter-spacing: 3px; }
  .k .prog .on { color: var(--blue); } .k .prog .done { color: var(--green); }
  .diff { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .diff .hd { height: 27px; line-height: 27px; padding: 0 12px; background: #161b22; color: var(--dim); font-size: 12.5px; border-bottom: 1px solid var(--line); }
  .diff .dl { height: 22px; line-height: 22px; padding: 0 12px; white-space: pre; color: var(--dim); }
  .diff .dl.add { background: #12261a; color: #aff5b4; }
  .diff .dl.del { background: #2d1517; color: #ffc1bc; }
  .big { font-size: 22px; line-height: 34px; height: 34px; font-weight: 700; white-space: pre; }
  .strike { text-decoration: line-through; text-decoration-thickness: 2px; }
  .tag { text-align: center; color: var(--dim); }
  .tag b { color: var(--fg); }
</style>
</head>
<body>
<div id="stage">
  <div class="win">
    <div class="bar">
      <span class="dot" style="background:#ff5f57"></span>
      <span class="dot" style="background:#febc2e"></span>
      <span class="dot" style="background:#28c840"></span>
      <span class="title">~/projects/demo-app — claude</span>
    </div>
    <div class="body" id="body"></div>
  </div>
</div>
<script>
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const typed = (s, start, cps, t) => s.slice(0, clamp(Math.floor((t - start) * cps), 0, s.length));
const caretOn = (t) => Math.floor(t * 2.2) % 2 === 0;
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const spinner = (t) => `<span class="spin" style="transform:rotate(${(t * 540) % 360}deg)"></span>`;
const L = (html = "", cls = "") => `<div class="l ${cls}">${html}</div>`;

// ---------- view 1: the run ----------
const ROWS = [
  { cmd: "git clone github.com/example/demo-app", mark: "✘", c: "r", why: "repository not found",                time: "0.8s" },
  { cmd: "cd demo-app",                           mark: "✔", c: "g", why: "",                                    time: "0.0s" },
  { cmd: "npm install",                           mark: "!", c: "y", why: "works, but CI needs a lockfile",      time: "0.8s" },
  { cmd: "cp .env.example .env",                  mark: "✘", c: "r", why: "renamed to .env.sample in 6f2b9b3",   time: "0.0s" },
  { cmd: "npm run seed",                          mark: "✘", c: "r", why: "script deleted in 6f2b9b3",           time: "0.1s" },
  { cmd: "npm start",                             mark: "✘", c: "r", why: "now “dev”, and needs SESSION_SECRET", time: "0.1s" },
  { cmd: "“open the dashboard”",                  mark: "?", c: "y", why: "no URL given",                        time: "  –" },
];
const SUGS = [
  { s: "+", c: "g", verb: "add",    what: "SESSION_SECRET to setup", why: "src/server.js exits without it" },
  { s: "+", c: "g", verb: "add",    what: "http://localhost:5173",   why: "the port changed from 3000" },
  { s: "+", c: "g", verb: "add",    what: "Node ≥ 20 requirement",   why: "package.json “engines” demands it" },
  { s: "−", c: "r", verb: "remove", what: "npm run seed",            why: "the script was deleted" },
  { s: "−", c: "r", verb: "remove", what: "Travis CI badge",         why: "CI moved to GitHub Actions" },
  { s: "↻", c: "p", verb: "sync",   what: "README.tr.md",            why: "it still says “npm start”" },
];
const ROW0 = 3.7, ROWGAP = 0.62, ROWRES = 0.48;

function view1(t) {
  let h = "";
  const cmd = typed("/fresh-clone", 0.45, 13, t);
  const entered = t >= 1.75;
  h += L(`<span class="b bold">❯</span> ${cmd}${!entered && caretOn(t) ? '<span class="caret"></span>' : ""}`);
  h += L();
  if (t >= 2.0) h += L(t < 2.6 ? `${spinner(t)} Cloning demo-app into a throwaway folder…`
                               : `<span class="g">●</span> Cloned demo-app into a throwaway folder`);
  if (t >= 2.8) h += L(`<span class="g">●</span> Read README.md <span class="dim">→ 7 setup steps</span>`);
  if (t >= 3.25) h += L(`<span class="g">●</span> Following them like a brand-new user:`);
  ROWS.forEach((r, i) => {
    const st = ROW0 + i * ROWGAP;
    if (t < st) return;
    const done = t >= st + ROWRES;
    h += `<div class="row"><span></span>` +
      (done ? `<span class="${r.c} bold">${r.mark}</span>` : `<span>${spinner(t)}</span>`) +
      `<span><code>${esc(r.cmd)}</code></span>` +
      `<span class="t">${done ? r.time : ""}</span>` +
      `<span class="${r.c === "g" ? "dim" : r.c}">${done ? esc(r.why) : ""}</span></div>`;
  });
  if (t >= 8.4) {
    h += L();
    h += L(`  <span class="pill r">1/7 steps work</span>  <span class="dim">time to first run:</span> <span class="r bold">never</span> <span class="dim">· stuck at step 1</span>`);
  }
  if (t >= 9.2) { h += L(); h += L(`  <span class="dim">What to change in README.md, and why:</span>`); }
  SUGS.forEach((s, i) => {
    const st = 9.6 + i * 0.5;
    if (t < st) return;
    h += `<div class="sug"><span>  </span><span class="${s.c} bold">${s.s} ${s.verb}</span>` +
      `<span><code>${esc(s.what)}</code></span><span class="dim">because ${esc(s.why)}</span></div>`;
  });
  if (t >= 13.0) { h += L(); h += L(`  <span class="b">8 fixes found.</span> Let's go through them one at a time.`); }
  return h;
}

// ---------- view 2: one question at a time ----------
function prog(n) {
  if (!n) return "";
  let s = "";
  for (let i = 1; i <= 8; i++) s += i < n ? `<span class="done">●</span>` : i === n ? `<span class="on">●</span>` : "○";
  return `<span class="prog">${s}</span>`;
}
function diff(head, lines) {
  let h = `<div class="diff"><div class="hd">${head}</div>`;
  lines.forEach(([kind, text]) => {
    const sign = kind === "add" ? "+ " : kind === "del" ? "- " : "  ";
    h += `<div class="dl ${kind}">${sign}${esc(text)}</div>`;
  });
  return h + `</div>`;
}
function card(t, k, n, q, why, opts, cursor, hit, otherText, otherTyping, preview) {
  let h = `<div class="card"><div class="k">${k}${prog(n)}</div><div class="q">${q}</div><div class="why">${why}</div>`;
  opts.forEach((o, i) => {
    let label = o;
    if (i === 2) {
      const txt = otherText !== null
        ? `<span class="input">${esc(otherText)}</span>${otherTyping && caretOn(t) ? '<span class="caret"></span>' : ""}`
        : `<span class="faint">type your own answer…</span>`;
      label = `Other: ${txt}`;
    }
    const cls = i === cursor ? (hit ? "opt on hit" : "opt on") : "opt";
    h += `<div class="${cls}"><span class="ptr">❯</span>${i + 1}. ${label}</div>`;
  });
  return h + (preview || "") + `</div>`;
}

function view2(t) {
  let h = "";
  h += L(`<span class="b bold">❯</span> /fresh-clone <span class="dim">· 8 fixes · one at a time · Yes / No / or say it your way</span>`);
  h += L();
  const log = [];
  if (t >= 15.8)  log.push(`<span class="g bold">✔</span> remove <code>npm run seed</code>`);
  if (t >= 19.4)  log.push(`<span class="g bold">✔</span> add <code>SESSION_SECRET</code> <span class="dim">+ how to generate one (your words)</span>`);
  if (t >= 20.6)  log.push(`<span class="g bold">✔</span> remove Travis CI badge`);
  if (t >= 20.85) log.push(`<span class="dim">  … 5 more  →  7 accepted, 1 skipped</span>`);
  if (t >= 22.2)  log.push(`<span class="g bold">✔</span> PR opened <span class="dim">→</span> <code>docs: fix README setup steps</code> <span class="b">#14</span>`);
  log.forEach((x) => (h += L(x)));
  if (log.length) h += L();

  if (t < 15.95) {
    h += card(t, "Fix 1 of 8", 1, "Remove the “npm run seed” step?",
      "That script was deleted in 6f2b9b3, so the command always fails.",
      ["Yes, remove it", "No, keep it", ""], 0, t >= 15.45, null, false,
      diff("README.md · Getting started", [
        ["ctx", "cp .env.example .env"],
        ["del", "npm run seed"],
        ["ctx", "npm start"],
      ]));
  } else if (t < 19.55) {
    let cur = 0;
    if (t >= 16.7) cur = 1;
    if (t >= 17.0) cur = 2;
    const typing = t >= 17.3;
    const other = typing ? typed("yes, and show how to generate one", 17.3, 22, t) : null;
    const lines = [
      ["add", "## Configuration"],
      ["add", "SESSION_SECRET   required, any long random string"],
    ];
    if (t >= 19.15) lines.push(["add", "                 generate one: openssl rand -hex 32"]);
    h += card(t, "Fix 2 of 8", 2, "Add SESSION_SECRET to the setup section?",
      "src/server.js exits on boot without it, and the README never mentions it.",
      ["Yes, add it", "No, skip it", ""], cur, t >= 19.15, other, typing && t < 19.15,
      diff("README.md · new section", lines));
  } else if (t < 20.75) {
    h += card(t, "Fix 3 of 8", 3, "Remove the Travis CI badge?",
      "It shows “build unknown”; CI moved to GitHub Actions in 6f2b9b3.",
      ["Yes, remove it", "No, keep it", ""], 0, t >= 20.25, null, false,
      diff("README.md · top", [
        ["ctx", "# demo-app"],
        ["del", "[![Build Status](https://travis-ci.org/example/demo-app.svg)](…)"],
      ]));
  } else if (t >= 21.05 && t < 22.35) {
    h += card(t, "Last one", 0, "Open a pull request with these fixes?",
      "They go on a new branch, so your current branch stays untouched.",
      ["Yes, open a PR", "No, just keep the edits", ""], 0, t >= 21.85, null, false,
      diff("branch fresh-clone/readme-fixes", [
        ["ctx", "README.md      +11  −6"],
        ["ctx", "README.tr.md   +4   −3"],
      ]));
  }
  return h;
}

// ---------- view 3: re-test ----------
const FIXED = [
  { cmd: "git clone github.com/skyfall/demo-app", time: "1.1s", why: "" },
  { cmd: "cd demo-app",                           time: "0.0s", why: "" },
  { cmd: "npm ci",                                time: "6.3s", why: "" },
  { cmd: "cp .env.sample .env",                   time: "0.0s", why: "" },
  { cmd: "npm run dev",                           time: "1.4s", why: "listening on 5173" },
  { cmd: "open http://localhost:5173",            time: "0.2s", why: "200 OK · “Demo dashboard”" },
];
function view3(t) {
  let h = "";
  h += L(`<span class="b bold">❯</span> re-test the fixed README`);
  h += L();
  h += L(t < 23.9 ? `${spinner(t)} Cloning the PR branch into a fresh folder…`
                  : `<span class="g">●</span> Fresh clone of <code>fresh-clone/readme-fixes</code>`);
  FIXED.forEach((r, i) => {
    const st = 24.0 + i * 0.36;
    if (t < st) return;
    const done = t >= st + 0.24;
    h += `<div class="row"><span></span>` +
      (done ? `<span class="g bold">✔</span>` : `<span>${spinner(t)}</span>`) +
      `<span><code>${esc(r.cmd)}</code></span><span class="t">${done ? r.time : ""}</span>` +
      `<span class="dim">${done ? esc(r.why) : ""}</span></div>`;
  });
  if (t >= 26.6) {
    h += L(); h += L();
    h += `<div class="big">  <span class="g">✔ 6/6 steps work</span></div>`;
    h += L();
    const ok = t >= 27.2;
    h += `<div class="big" style="font-weight:600">  <span class="dim">time to first run</span>  ` +
      `<span class="r ${ok ? "strike" : ""}">never</span>` +
      (ok ? `  <span class="dim">→</span>  <span class="g">9s</span>` : "") + `</div>`;
  }
  if (t >= 28.2) {
    h += L(); h += L(); h += L(); h += L(); h += L();
    h += L(`<b>fresh-clone</b>  ·  Does your README still work? Claude tries it and tells you.`, "tag");
  }
  return h;
}

window.render = function (t) {
  document.getElementById("body").innerHTML = t < 14.2 ? view1(t) : t < 23.4 ? view2(t) : view3(t);
};
window.DURATION = 31.5;
window.render(0);
</script>
</body>
</html>
